<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人格图鉴 · 软文素材</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="mast">
      <header class="hero">
        <div class="hero-copy">
          <p class="kicker">虾说说 · 人格图鉴</p>
          <div class="hero-title">
            <h1>软文素材台</h1>
            <p class="meta" id="meta"></p>
          </div>
          <div class="ops-projects" id="projects"></div>
          <div class="ops-split">
            <article class="lane you">
              <h2>你要干 <span>Mark</span></h2>
              <ol id="you-list"></ol>
            </article>
            <article class="lane me">
              <h2>我要干 <span>Cursor</span></h2>
              <ol id="me-list"></ol>
            </article>
          </div>
        </div>
        <div class="hero-tools">
          <p class="filters" id="filters"></p>
          <div class="sync" id="sync" hidden>
            <p>在 GitHub 给仓库 <code>Chenzyishere/xhs-copy</code> 开一枚 fine-grained PAT，权限只要 Contents 读写。贴在下面，只存在这台设备。</p>
            <input id="sync-token" type="password" autocomplete="off" placeholder="github_pat_…">
            <div class="sync-actions">
              <button type="button" id="sync-save">保存并同步</button>
              <button type="button" class="ghost" id="sync-clear">清除 token</button>
            </div>
          </div>
        </div>
      </header>
      <nav class="cal" id="days"></nav>
    </div>
    <main id="board"></main>
    <footer class="ops-foot">
      <p class="ops-later"><strong>先别做</strong> <span id="later"></span></p>
      <div class="rules" id="rules"></div>
    </footer>
  </div>
  <div class="toast" id="toast" hidden>已复制</div>
  <script src="js/data.js"></script>
  <script src="js/data-winter.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/board-data.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
